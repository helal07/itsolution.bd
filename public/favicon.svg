<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Shield Shape -->
  <path d="M 256 96 C 330 96 384 128 384 128 C 384 270 290 376 256 416 C 222 376 128 270 128 128 C 128 128 182 96 256 96 Z" 
        fill="rgba(255, 255, 255, 0.08)" 
        stroke="url(#glowGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Glowing IT Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="246" letter-spacing="4">IT</text>
  </g>

  <!-- Accent dot / Sparkle -->
  <circle cx="340" cy="180" r="14" fill="#38bdf8" />
  <path d="M 340 160 L 340 200 M 320 180 L 360 180" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
</svg>
